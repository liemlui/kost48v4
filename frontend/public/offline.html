<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0ea5e9" />
    <title>KOST48 sedang offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f8fafc; color: #0f172a; }
      main { width: min(90vw, 30rem); padding: 2rem; border: 1px solid #dbeafe; border-radius: 1rem; background: #fff; box-shadow: 0 1rem 3rem rgba(15, 23, 42, .08); }
      h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
      p { margin: 0 0 1.25rem; color: #475569; line-height: 1.6; }
      button { border: 0; border-radius: .65rem; padding: .75rem 1rem; background: #0284c7; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Koneksi internet terputus</h1>
      <p>Halaman aman yang pernah dibuka masih dapat tersedia, tetapi data dan transaksi KOST48 memerlukan koneksi aktif.</p>
      <button type="button" onclick="window.location.reload()">Coba Lagi</button>
    </main>
  </body>
</html>
